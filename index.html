<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kebugaran Jasmani - PJOK Kelas VII</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .question-box {
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .option-label:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: var(--primary-color);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .feedback-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kuis Kebugaran Jasmani</h1>
        <p class="subtitle">Materi PJOK Kelas VII (Hal. 187 - 210)</p>

        <form id="quizForm">
            <div id="quizContainer"></div>
            <button type="button" class="btn" onclick="submitQuiz()">Selesai & Lihat Nilai</button>
        </form>

        <div id="resultContainer" class="result-container">
            <h2>Hasil Kuis Anda</h2>
            <div class="score-display" id="scoreDisplay">0 / 10</div>
            <p class="feedback-text" id="feedbackText"></p>
            <button type="button" class="btn" onclick="resetQuiz()">Ulangi Kuis</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "1. Kemampuan seseorang dalam melakukan berbagai aktivitas sehari-hari tanpa mengalami kelelahan yang berlebihan serta masih memiliki cadangan tenaga disebut dengan...",
                options: [
                    "Kekuatan otot",
                    "Kebugaran jasmani",
                    "Kelentukan tubuh",
                    "Kelincahan gerak"
                ],
                answer: 1
            },
            {
                question: "2. Unsur-unsur kebugaran jasmani secara garis besar dikelompokkan menjadi komponen yang berkaitan dengan kesehatan dan...",
                options: [
                    "Keterampilan",
                    "Keindahan tubuh",
                    "Kecepatan reaksi",
                    "Keseimbangan statis"
                ],
                answer: 0
            },
            {
                question: "3. Latihan push-up (angkat badan) yang dilakukan secara rutin dan benar bertujuan terutama untuk melatih kekuatan dan ketahanan otot...",
                options: [
                    "Perut dan pinggang",
                    "Lengan dan bahu",
                    "Kaki dan betis",
                    "Leher dan punggung"
                ],
                answer: 1
            },
            {
                question: "4. Bentuk latihan fisik yang berfungsi khusus untuk melatih kekuatan otot perut (abdominal strength) adalah...",
                options: [
                    "Back-lift",
                    "Push-up",
                    "Sit-up",
                    "Pull-up"
                ],
                answer: 2
            },
            {
                question: "5. Latihan back-lift dalam program kebugaran jasmani ditujukan untuk memperkuat otot...",
                options: [
                    "Punggung dan pinggang",
                    "Dada dan perut",
                    "Lengan atas",
                    "Kaki bagian depan"
                ],
                answer: 0
            },
            {
                question: "6. Kemampuan persendian untuk dapat bergerak secara bebas, terutama dalam ruang gerak sendi secara maksimal disebut dengan istilah...",
                options: [
                    "Kekuatan (strength)",
                    "Daya tahan (endurance)",
                    "Kelentukan (flexibility)",
                    "Kecepatan (speed)"
                ],
                answer: 2
            },
            {
                question: "7. Kemampuan jantung, paru-paru, dan pembuluh darah untuk berfungsi secara optimal saat melakukan aktivitas fisik dalam jangka waktu yang lama berkaitan dengan...",
                options: [
                    "Daya tahan jantung dan paru-paru",
                    "Kelincahan gerak tubuh",
                    "Kekuatan otot tungkai",
                    "Daya ledak otot"
                ],
                answer: 0
            },
            {
                question: "8. Sebelum melakukan inti latihan kebugaran jasmani untuk menghindari cedera, tahapan awal yang wajib dilakukan adalah...",
                options: [
                    "Pendinginan (cooling down)",
                    "Pemanasan (warming up)",
                    "Latihan inti beban berat",
                    "Lari cepat jarak jauh"
                ],
                answer: 1
            },
            {
                question: "9. Aktivitas lari bolak-balik dengan menempuh jarak tertentu secara cepat untuk melatih kemampuan mengubah arah disebut dengan latihan...",
                options: [
                    "Shuttle run (lari bolak-balik)",
                    "Jogging santai",
                    "Sprint jarak pendek",
                    "Lari pelan berkesinambungan"
                ],
                answer: 0
            },
            {
                question: "10. Tahap akhir yang dilakukan setelah selesai melakukan seluruh rangkaian latihan kebugaran jasmani agar kondisi tubuh kembali normal secara bertahap adalah...",
                options: [
                    "Pemanasan",
                    "Pendinginan",
                    "Peregangan statis berat",
                    "Latihan kekuatan inti"
                ],
                answer: 1
            }
        ];

        function loadQuiz() {
            const container = document.getElementById("quizContainer");
            let output = "";

            quizData.forEach((q, index) => {
                output += `
                    <div class="question-box">
                        <div class="question-title">${q.question}</div>
                        <ul class="options-list">
                `;
                q.options.forEach((opt, optIndex) => {
                    output += `
                        <li class="option-item">
                            <label class="option-label">
                                <input type="radio" name="question${index}" value="${optIndex}">
                                ${opt}
                            </label>
                        </li>
                    `;
                });
                output += `</ul></div>`;
            });

            container.innerHTML = output;
        }

        function submitQuiz() {
            let score = 0;
            let unanswered = false;

            quizData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question${index}"]:checked`);
                if (!selected) {
                    unanswered = true;
                } else if (parseInt(selected.value) === q.answer) {
                    score += 10;
                }
            });

            if (unanswered) {
                alert("Mohon jawab semua soal terlebih dahulu!");
                return;
            }

            document.getElementById("quizForm").style.display = "none";
            const resultContainer = document.getElementById("resultContainer");
            resultContainer.style.display = "block";

            document.getElementById("scoreDisplay").innerText = `${score} / 100`;
            
            let feedback = "";
            if (score === 100) {
                feedback = "Luar biasa! Anda menguasai materi dengan sangat baik.";
            } else if (score >= 70) {
                feedback = "Bagus! Pemahaman Anda terhadap materi sudah baik.";
            } else {
                feedback = "Tetap semangat! Silakan pelajari kembali buku ajar halaman 187–210.";
            }
            document.getElementById("feedbackText").innerText = feedback;
        }

        function resetQuiz() {
            document.getElementById("quizForm").reset();
            document.getElementById("quizForm").style.display = "block";
            document.getElementById("resultContainer").style.display = "none";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        loadQuiz();
    </script>
</body>
</html>
